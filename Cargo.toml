[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cxy-251/BullshitCompiler"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 2
lto = "thin"

# Web 构建体积优先
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
