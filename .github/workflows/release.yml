# 发布原生版：为 Linux / Windows / macOS 构建程序，建立 GitHub Release（标签 v主.次.修订）并附上安装包。
#
# 版本号规则（见 CLAUDE.md）：次版本号（第二位）变化时才发布 Release；只改修订号（第三位）时不发布，只部署网页。
# 也可以在 Actions 页面手动运行，按当前版本号发布。
# Linux 版在 ubuntu-22.04 上构建，glibc 版本较低，能在 SteamOS 等较新的发行版上直接运行。
name: 发布原生版

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.cmp.outputs.release }}
      version: ${{ steps.cmp.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: cmp
        name: 比较次版本号
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          ver() { grep -m1 '^version *=' | sed 's/.*"\(.*\)".*/\1/'; }
          now=$(ver < Cargo.toml)
          old=$(git show "$BEFORE:Cargo.toml" 2>/dev/null | ver || true)
          echo "推送前 ${old:-无}，现在 $now"
          echo "version=$now" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "${old%.*}" != "${now%.*}" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: bsc-app-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: bsc-app-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: bsc-app-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p bsc-app --target ${{ matrix.target }}
      - name: 打包 (Unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release bsc-app
      - name: 打包 (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/bsc-app.exe -DestinationPath ${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            BSc 编译原理实验室 v${{ needs.version.outputs.version }}

            - Linux（x86_64，Steam Deck 桌面模式可用）：bsc-app-linux-x86_64.tar.gz，解压后运行 `./bsc-app`
            - Windows（x86_64）：bsc-app-windows-x86_64.zip，解压后运行 `bsc-app.exe`
            - macOS（Apple 芯片）：bsc-app-macos-arm64.tar.gz，解压后运行 `./bsc-app`（首次打开可能要在"隐私与安全性"里允许）

            Web 版：见仓库的 GitHub Pages。
          files: dist/*
