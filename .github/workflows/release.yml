# 发布原生版：为 Windows / macOS / Linux 生成安装包，建立 GitHub Release（标签 v主.次.修订）并附上。
#   Windows：.msi 安装包 + 安装程序 .exe（NSIS）
#   macOS：  .dmg（Apple 芯片）
#   Linux：  .deb（Debian/Ubuntu）+ .AppImage（下载即用，Steam Deck 桌面模式推荐）
#   另有各平台便携版（解压即用，不用安装），以及所有文件的 SHA256SUMS.txt。
#   Windows 版静态链接 C 运行库，不需要另装 VC++ 运行库；字体都打包在程序里，装上就能用。
# 安装包由 cargo-packager 生成，配置在 crates/bsc-app/Cargo.toml 的 [package.metadata.packager]。
#
# 版本号规则（见 CLAUDE.md）：次版本号（第二位）变化时才发布 Release；只改修订号（第三位）时不发布，只部署网页。
# 也可以在 Actions 页面手动运行，按当前版本号发布（同一个版本重新发布会替换掉旧的安装包）。
name: 发布原生版

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.cmp.outputs.release }}
      version: ${{ steps.cmp.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: cmp
        name: 比较次版本号
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          ver() { grep -m1 '^version *=' | sed 's/.*"\(.*\)".*/\1/'; }
          now=$(ver < Cargo.toml)
          old=$(git show "$BEFORE:Cargo.toml" 2>/dev/null | ver || true)
          echo "推送前 ${old:-无}，现在 $now"
          echo "version=$now" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "${old%.*}" != "${now%.*}" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # glibc 较低，SteamOS 等较新的发行版都能运行
            formats: deb,appimage
          - os: windows-latest
            formats: wix,nsis
            rustflags: -C target-feature=+crt-static
          - os: macos-latest
            formats: dmg,app
    runs-on: ${{ matrix.os }}
    env:
      # Windows：静态链接 C 运行库（别人的电脑上不用装 VC++ 运行库）
      RUSTFLAGS: ${{ matrix.rustflags }}
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 cargo-packager
        run: cargo install cargo-packager --locked
      - name: 生成安装包
        working-directory: crates/bsc-app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1" # CI 机器上没有 FUSE，AppImage 工具解压后运行
        run: cargo packager --release --formats ${{ matrix.formats }} --binaries-dir ../../target/release --out-dir ../../packages
      - name: 收集安装包，打便携版
        shell: bash
        run: |
          ls -la packages
          mkdir upload
          find packages -maxdepth 1 -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} upload/ \;
          case "$RUNNER_OS" in
            Windows) 7z a "upload/BSc-Compiler-Lab_${VER}_windows_x64_portable.zip" ./target/release/bsc-app.exe ;;
            macOS)   ditto -c -k --keepParent packages/*.app "upload/BSc-Compiler-Lab_${VER}_macos_arm64_portable.zip" ;;
            Linux)   tar -czf "upload/BSc-Compiler-Lab_${VER}_linux_x64_portable.tar.gz" -C target/release bsc-app ;;
          esac
          ls -la upload
          test -n "$(ls upload)"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: upload/*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成 SHA256 校验和
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: 删掉同一版本旧的附件（重新发布时）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
              while read -r a; do gh release delete-asset "$TAG" "$a" --repo "$GITHUB_REPOSITORY" -y; done
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            BSc 编译原理实验室 v${{ needs.version.outputs.version }}：交互式编译原理课程 + 黑话编译器。

            | 系统 | 下载 | 用法 |
            |---|---|---|
            | Windows | `.msi` 或 `…-setup.exe` | 双击安装，开始菜单里打开。Windows 可能提示"未知发布者"，点"更多信息 → 仍要运行" |
            | macOS（Apple 芯片） | `.dmg` | 打开后把应用拖进"应用程序"。第一次打开要在"系统设置 → 隐私与安全性"里点"仍要打开"（没有苹果签名） |
            | Linux / Steam Deck | `.AppImage` | 下载后右键 → 属性 → 允许作为程序执行，双击运行；也可以 `chmod +x` 后直接运行 |
            | Debian / Ubuntu | `.deb` | `sudo apt install ./文件名.deb` |
            | 便携版（各平台） | `…_portable.zip` / `.tar.gz` | 不用安装：解压后直接运行 `bsc-app`（macOS 是解压出的应用） |

            所有程序都自带字体和运行所需的一切，不需要另装任何环境。
            校验下载是否完整：对照 `SHA256SUMS.txt`（Linux/macOS 用 `sha256sum -c SHA256SUMS.txt --ignore-missing`，Windows 用 `certutil -hashfile 文件名 SHA256`）。

            不想安装也可以直接用 Web 版（见仓库的 GitHub Pages）。
          files: dist/*
