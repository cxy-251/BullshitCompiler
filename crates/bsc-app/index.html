<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>BSc 编译原理实验室</title>
    <meta name="description" content="面向新手的交互式编译原理课程，以及把领导讲话编译成大白话的黑话编译器。" />

    <!-- trunk 构建指令：编译本 crate 为 wasm，发布时用体积优先的 web-release 配置 -->
    <link data-trunk rel="rust" data-bin="bsc-app" data-cargo-profile="web-release" data-wasm-opt="z" />
    <!-- 中文字体单独成一个文件、文件名固定：更新代码后浏览器仍可复用缓存的字体 -->
    <link data-trunk rel="copy-file" href="assets/fonts/NotoSansSC-Subset.ttf" data-target-path="fonts" />
    <link rel="preload" href="fonts/NotoSansSC-Subset.ttf" as="fetch" crossorigin="anonymous" />

    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1b1d21; }
        @media (prefers-color-scheme: light) { html, body { background: #f6f7f9; } }
        canvas#bsc_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
        #loading {
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
            color: #8a8f98; font-size: 16px; text-align: center; padding: 16px;
        }
        #loading .spinner {
            width: 36px; height: 36px; margin-bottom: 16px; border-radius: 50%;
            border: 3px solid rgba(128, 128, 128, 0.25); border-top-color: #4f82ee; animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <canvas id="bsc_canvas"></canvas>
    <div id="loading">
        <div class="spinner"></div>
        <p>BSc 编译原理实验室 加载中…<br /><small>第一次打开需要下载约 3 MB（其中一半是中文字体）；之后字体会从浏览器缓存读取，更新版本时只需下载约 1 MB。</small></p>
    </div>
</body>
</html>
