[package]
name = "bsc-app"
description = "BSc 编译原理实验室：跨平台图形界面（原生桌面 + Web）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "bsc-app"

[dependencies]
bsc-core = { path = "../bsc-core" }
bsc-calc = { path = "../bsc-calc" }
bsc-automata = { path = "../bsc-automata" }
bsc-minilang = { path = "../bsc-minilang" }
eframe = { version = "0.36", default-features = false, features = ["glow", "persistence", "wayland", "x11"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Response"] }

[lints]
workspace = true
