[package]
name = "bsc-app"
description = "BSc 编译原理实验室：跨平台图形界面（原生桌面 + Web）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "bsc-app"

# 安装包（cargo-packager）：Windows 的 .msi 和安装程序 .exe、macOS 的 .dmg、Linux 的 .deb 和 .AppImage。
# 由 .github/workflows/release.yml 调用，本地一般用不到。
[package.metadata.packager]
before-packaging-command = "cargo build --release -p bsc-app"
product-name = "BSc Compiler Lab"
identifier = "io.github.cxy251.bsc"
publisher = "cxy-251"
category = "Education"
description = "BSc 编译原理实验室：交互式编译原理课程 + 黑话编译器"
icons = ["assets/icon.png"]

[dependencies]
bsc-core = { path = "../bsc-core" }
bsc-calc = { path = "../bsc-calc" }
bsc-automata = { path = "../bsc-automata" }
bsc-minilang = { path = "../bsc-minilang" }
bsc-grammar = { path = "../bsc-grammar" }
bsc-types = { path = "../bsc-types" }
bsc-runtime = { path = "../bsc-runtime" }
bsc-jargon = { path = "../bsc-jargon" }
eframe = { version = "0.36", default-features = false, features = ["glow", "persistence", "wayland", "x11"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Response"] }

[lints]
workspace = true
