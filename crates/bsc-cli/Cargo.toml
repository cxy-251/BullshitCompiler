[package]
name = "bsc-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface and local server daemon for Bullshit Compiler"

[[bin]]
name = "bsc"
path = "src/main.rs"

[dependencies]
bsc-core = { path = "../bsc-core" }
bsc-classic = { path = "../bsc-classic" }
bsc-frontend = { path = "../bsc-frontend" }
bsc-opt = { path = "../bsc-opt" }
bsc-backend = { path = "../bsc-backend" }
bsc-decompiler = { path = "../bsc-decompiler" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
