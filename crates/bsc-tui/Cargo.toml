[package]
name = "bsc-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native cross-platform terminal workbench application for Bullshit Compiler"

[[bin]]
name = "bsc-tui"
path = "src/main.rs"

[dependencies]
bsc-core = { path = "../bsc-core" }
bsc-classic = { path = "../bsc-classic" }
bsc-decompiler = { path = "../bsc-decompiler" }
ratatui = "0.30.2"
crossterm = "0.29.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
